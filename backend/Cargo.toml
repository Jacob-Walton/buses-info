[package]
name = "buses_api"
version = "0.2.0"
edition = "2024"

[dependencies]
anyhow = "1.0.99"
async-trait = "0.1.89"
axum = "0.8.4"
chrono = { version = "0.4.41", features = ["serde"] }
reqwest = { version = "0.12.23", features = ["json"] }
scraper = "0.23.1"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.142"
thiserror = "2.0.16"
tokio = { version = "1.47.1", features = ["full"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["env-filter"] }
bcrypt = "0.17.0"
jsonwebtoken = "9.3.1"
uuid = { version = "1.11.0", features = ["v4", "serde"] }
sqlx = { version = "0.8.2", features = ["runtime-tokio-rustls", "postgres", "chrono", "uuid"] }
once_cell = "1.21.3"
email_address = "0.2.9"
dotenvy = "0.15.7"
oauth2 = "5.0.0"
base64 = "0.22.0"
rsa = "0.9.8"
redis = { version = "0.32.5", features = ["aio", "tokio-comp"] }
tower-cookies = "0.11.0"
tower-http = { version = "0.6.6", features = ["cors", "trace"] }
time = { version = "0.3.43", features = ["macros"] }

[dev-dependencies]
sqlx = { version = "0.8.2", features = ["runtime-tokio-rustls", "sqlite", "chrono", "uuid"] }
anyhow = "1.0.99"
tower = { version = "0.5.2", features = ["util"] }
hyper = { version = "1.7.0", features = ["full"] }
tower-http = { version = "0.6.6", features = ["trace"] }

[profile.release]
lto = "thin"
codegen-units = 16
opt-level = 3
strip = "symbols"
debug = 1
panic = "abort"
overflow-checks = false
incremental = false

[profile.dev]
debug = 2
codegen-units = 256
lto = false
strip = "none"
opt-level = 0
overflow-checks = true
panic = "unwind"
incremental = false

[profile.dev-opt]
inherits = "dev"
opt-level = 1
lto = false
codegen-units = 16

[profile.release-with-debug]
inherits = "release"
debug = 2
strip = "none"
lto = "thin"

[profile.lowend]
inherits = "release"
opt-level = 0
lto = false
codegen-units = 256
strip = "symbols"
debug = 0
panic = "abort"
overflow-checks = false
incremental = false
