version: '3.8'

services:
  test-db:
    image: postgres:17-alpine
    container_name: buses_test_db
    environment:
      POSTGRES_DB: test_buses
      POSTGRES_USER: test_user
      POSTGRES_PASSWORD: test_pass
    ports:
      - "5433:5432"
    volumes:
      - test_db_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test_user -d test_buses"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  test_db_data:
