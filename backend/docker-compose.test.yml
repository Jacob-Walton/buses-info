services:
  test-db:
    image: postgres:17-alpine
    container_name: buses_test_db
    environment:
      POSTGRES_DB: test_buses
      POSTGRES_USER: test_user
      POSTGRES_PASSWORD: test_pass
    ports:
      - "5433:5432"
    volumes:
      - ./migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test_user -d test_buses"]
      interval: 5s
      timeout: 5s
      retries: 5
  test-redis:
    image: redis:8-alpine
    container_name: buses_test_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5