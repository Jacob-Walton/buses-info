[profile.release]
lto = "thin"
codegen-units = 16
opt-level = 3
strip = "symbols"
debug = 1
panic = "abort"
overflow-checks = false
incremental = false

[profile.dev]
debug = 2
incremental = true
codegen-units = 256
lto = false
strip = "none"
opt-level = 0
overflow-checks = true
panic = "unwind"

[profile.dev-opt]
inherits = "dev"
opt-level = 1
lto = false
codegen-units = 16

[profile.release-with-debug]
inherits = "release"
debug = 2
strip = "none"
lto = "thin"

[profile.lowend]
inherits = "release"
opt-level = 0
lto = false
codegen-units = 256
strip = "symbols"
debug = 0
panic = "abort"
overflow-checks = false
incremental = true